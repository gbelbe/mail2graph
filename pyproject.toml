[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail2graph"
version = "0.1.0"
description = "Connecteur courriel -> graphe RDF : IMAP, extraction, liaison aux entités, relecture humaine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "typer>=0.12",
  "rdflib>=7",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
imap = ["imap-tools>=1.7"]
ner = ["gliner>=0.2"]
dev = ["pytest>=8", "pyshacl>=0.26"]

[project.scripts]
mail2graph = "mail2graph.cli:app"

# Les adaptateurs tiers s'enregistrent ici : mail2graph.sources, .extractors, .stores, .queues
# [project.entry-points."mail2graph.extractors"]
# mon_extracteur = "mon_paquet:fabrique"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
