[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail2graph"
version = "0.1.0"
description = "Connecteur courriel -> graphe RDF : IMAP, extraction, liaison aux entités, relecture humaine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "typer>=0.12",
  "rdflib>=7",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
imap = ["imap-tools>=1.7"]
ner = ["gliner>=0.2"]
dev = ["pytest>=8", "pytest-bdd>=8", "pytest-cov>=5", "pyshacl>=0.26"]

[project.scripts]
mail2graph = "mail2graph.cli:app"

# Les adaptateurs tiers s'enregistrent ici : mail2graph.sources, .extractors, .stores, .queues
# [project.entry-points."mail2graph.extractors"]
# mon_extracteur = "mon_paquet:fabrique"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "wip: scénario décrivant une fonctionnalité pas encore implémentée (ignoré)",
  "imap: scénario exigeant un serveur IMAP de test (ignoré tant qu'il n'y en a pas)",
  "ingestion", "linking", "review", "privacy", "cli", "extensibility", "graph",
  "mutation: tests unitaires sélectionnés pour mutmut",
]

[tool.mutmut]
paths_to_mutate = ["src/mail2graph/"]
do_not_mutate = ["src/mail2graph/__init__.py", "src/mail2graph/cli.py", "src/mail2graph/config.py", "src/mail2graph/factory.py", "src/mail2graph/ports.py", "src/mail2graph/adapters/__init__.py", "src/mail2graph/adapters/sources.py", "src/mail2graph/adapters/rdf_store.py", "src/mail2graph/adapters/stores.py"]
tests_dir = ["tests/"]
also_copy = [".gitignore", "tools"]
pytest_add_cli_args_test_selection = ["tests/test_pipeline.py", "tests/test_behaviour_details.py", "tests/test_gliner_extractor.py", "tests/features/test_features.py"]
